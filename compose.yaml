# This compose.yaml was generated by Defang.
# It defines the services for a MongoDB application.

services:
  db:
    image: mongo:5
    x-defang-mongodb: true
    ports:
      - mode: host
        target: 27017
        published: 27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME
      - MONGO_INITDB_ROOT_PASSWORD
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5